name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable -c rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2 ffmpeg xvfb

      - name: Fetch libmpv headers
        run: |
          ./scripts/fetch-mpv-deps.sh
          dir="$GITHUB_WORKSPACE/.deps/mpv/usr/lib/x86_64-linux-gnu"
          {
            echo "MPV_LIBRARY_DIR=$dir"
            echo "LIBRARY_PATH=$dir"
            echo "LD_LIBRARY_PATH=$dir"
            echo "PKG_CONFIG_PATH=$dir/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Check the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: xvfb-run -a cargo test -p skjalf --test mpv_integration --locked -- --ignored --test-threads=1
      - run: cargo build --release -p skjalf --locked

      - name: Packaging tests
        env:
          SKJALF_TEST_BINARY: ${{ github.workspace }}/target/release/skjalf
          SKJALF_TEST_MPV_LIB_DIR: ${{ env.MPV_LIBRARY_DIR }}
        run: python3 -I -m unittest discover -s packaging/tests -v

      - name: Build release assets
        run: ./packaging/make-release.sh target/release/skjalf dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Skjalf TV %s\n\nInstall on a Steam Deck in Desktop Mode:\n\n    curl -fsSL https://github.com/bikemazzell/skjalf-tv/releases/latest/download/install.sh | sh\n\nVerify downloads against SHA256SUMS.\n' "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/skjalf-tv-x86_64.tar.gz dist/install.sh dist/uninstall.sh dist/SHA256SUMS \
            --title "Skjalf TV $VERSION" --notes-file notes.md
